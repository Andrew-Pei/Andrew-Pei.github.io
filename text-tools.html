<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="免费统计文本字符、汉字、英文单词和行数，并清理多余空格。"><title>文本统计与清理｜效率工具箱</title><link rel="stylesheet" href="styles.css"></head><body data-tool="text"><nav class="nav"><div class="wrap"><a class="brand" href="index.html">⚡ 效率工具箱</a><div class="links"><a href="index.html">工具</a><a href="guides.html">使用指南</a><a href="about.html">关于</a></div></div></nav><main class="wrap section"><article class="article"><p class="tag">写作与整理</p><h1>文本统计与清理</h1><p>粘贴文字即可查看字数、英文单词、字符和行数。处理过程完全在本地浏览器完成。</p></article><section class="tool"><label for="text-input">输入文本</label><textarea id="text-input" placeholder="在这里输入或粘贴文本…"></textarea><button id="clean-space" class="alt">清理多余空格</button><div id="text-result" class="result"></div></section><article class="article"><h2>字数统计的说明</h2><p>“汉字”按常用汉字字符统计；英文单词以连续的字母或数字组合识别。不同平台的计数规则可能不同，本工具适合写作和编辑时快速估算。</p><h2>为什么不同软件的字数会不同？</h2><p>“汉字”“字符”和“英文单词”本来就是不同指标，空格、换行和标点也可能采用不同统计口径。可以阅读<a href="guide-character-count.html">中文“字数”、字符数、英文单词数有什么区别？</a>了解具体规则。</p></article></main><footer class="footer"><div class="wrap"><a href="guides.html">使用指南</a><a href="privacy.html">隐私</a><a href="contact.html">联系</a></div></footer><script src="app.js"></script></body></html>
