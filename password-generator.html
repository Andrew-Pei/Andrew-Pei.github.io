<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="免费随机密码生成器，使用浏览器安全随机数，不上传生成的密码。"><title>随机密码生成器｜效率工具箱</title><link rel="stylesheet" href="styles.css"></head><body data-tool="password"><nav class="nav"><div class="wrap"><a class="brand" href="index.html">⚡ 效率工具箱</a><div class="links"><a href="index.html">工具</a><a href="guides.html">使用指南</a><a href="about.html">关于</a></div></div></nav><main class="wrap section"><article class="article"><p class="tag">隐私安全</p><h1>随机密码生成器</h1><p>通过浏览器的加密安全随机数生成密码。生成结果仅显示在当前页面，不会被提交或保存。</p></article><section class="tool"><label for="length">密码长度（8–64）</label><input id="length" type="number" min="8" max="64" value="16"><button id="make-password">生成新密码</button><button id="copy-password" class="alt">复制密码</button><div id="password-result" class="result"></div></section><article class="article"><h2>更安全的使用方式</h2><p>每个重要账户使用不同的长密码，并把它们保存在可信的密码管理器中。启用双重验证可进一步降低密码泄露带来的风险。不要把密码分享给任何人或粘贴到不可信的表单。</p><h2>为什么要关注长度和随机性？</h2><p>安全密码不应该依赖生日、姓名等容易猜测的信息，也不应该在多个网站重复使用。可以阅读<a href="guide-password-security.html">安全密码应该怎么设置？</a>了解长度、随机性和密码管理器的关系。</p></article></main><footer class="footer"><div class="wrap"><a href="guides.html">使用指南</a><a href="privacy.html">隐私</a><a href="contact.html">联系</a></div></footer><script src="app.js"></script></body></html>
