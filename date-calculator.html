<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="免费计算两个日期相差多少天、工作日与周末天数。"><title>日期计算器｜效率工具箱</title><link rel="stylesheet" href="styles.css"></head><body data-tool="date"><nav class="nav"><div class="wrap"><a class="brand" href="index.html">⚡ 效率工具箱</a><div class="links"><a href="index.html">工具</a><a href="guides.html">使用指南</a><a href="about.html">关于</a></div></div></nav><main class="wrap section"><article class="article"><p class="tag">日期与计划</p><h1>日期计算器</h1><p>计算两个日期之间的自然日、工作日和周末天数。工作日按周一至周五计算，未扣除法定节假日。</p></article><section class="tool"><div class="two"><div><label for="start">开始日期</label><input id="start" type="date"></div><div><label for="end">结束日期</label><input id="end" type="date"></div></div><button id="calc-date">开始计算</button><div id="date-result" class="result"></div></section><article class="article"><h2>适合哪些场景？</h2><p>可用于项目倒计时、试用期、旅行天数、学习计划和合同日期的初步核对。涉及薪资、法定假期或合同效力时，请以当地规定和书面文件为准。</p><h2>先理解“天数”的口径</h2><p>同一组日期可能因为是否包含首尾日期而得到不同结果。建议先阅读<a href="guide-date-difference.html">两个日期相差多少天？三种常见计算口径</a>，再使用计算结果。</p><h2>工作日为什么只是估算</h2><p>本工具按周一至周五统计，不自动扣除法定节假日和调休。关于这个边界，可以阅读<a href="guide-workdays.html">工作日怎么计算？</a>。</p></article></main><footer class="footer"><div class="wrap"><a href="guides.html">使用指南</a><a href="privacy.html">隐私</a><a href="contact.html">联系</a></div></footer><script src="app.js"></script></body></html>
